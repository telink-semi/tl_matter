pull_request_rules:
    - name: Label conflicting pull requests
      description: Add a label to a pull request with conflict to spot it easily
      conditions:
          - conflict
          - "-closed"
      actions:
          label:
              toggle:
                  - conflict
    # WARNING: If the rule name below is changed, you must also update the
    # condition `check-failure~=Automatic merge on PullApprove` to match the new name.
    - name: Automatic merge on PullApprove
      conditions:
          - or:
                - check-success=pullapprove
                - label="fast track"
          - "#approved-reviews-by>=1"
          - "#review-threads-unresolved=0"
          - "-draft"
          - label!=docker
          # Workaround for Mergify deadlock due to using "#check-failure=0":
          # Mergify's own action check can appear as failed/cancelled if conditions stop matching;
          # and GitHub keeps those historic failures forever. Since `#check-failure=0` counts ALL
          # failures (including historic ones), this would cause a deadlock and block merges indefinitely.
          # We whitelist only this self-check so merges aren't deadlocked, while all other failures still block.
          - or:
                - "#check-failure=0"
                - and:
                      - "#check-failure=1"
                      # WARNING: This must match the rule name defined above.
                      # If the rule name changes, update this condition accordingly.
                      - check-failure~=Automatic merge on PullApprove
          - "#check-pending=0"
          - check-success~=Build
          - or:
                - check-success=pullapprove
                - check-skipped=pullapprove
                - check-neutral=pullapprove
      actions:
          merge:
              method: squash

    # Backport rules - cherry-pick the squashed master commit after merge.
    # Apply a request-backport-* label (such as request-backport-latest or
    # request-backport-supported) on the master PR (before or after merge)
    # to trigger the corresponding backport.
    - name: Backport to v1.7-branch
      conditions:
          - merged
          - base=master
          - or:
                - label="request-backport-latest-mve-sve"
                - label="request-backport-latest"
                - label="request-backport-supported"
      actions:
          backport:
              branches:
                  - v1.7-branch
              labels:
                  - backport-v1.7-branch

    - name: Backport to v1.6.1-branch
      conditions:
          - merged
          - base=master
          - or:
                - label="request-backport-latest-mve-sve"
                - label="request-backport-supported"
      actions:
          backport:
              branches:
                  - v1.6.1-branch
              labels:
                  - backport-v1.6.1-branch

    - name: Backport to v1.6.1-mve-branch
      conditions:
          - merged
          - base=master
          - label="request-backport-latest-mve-sve"
      actions:
          backport:
              branches:
                  - v1.6.1-mve-branch
              labels:
                  - backport-v1.6.1-mve-branch

    - name: Backport to v1.6-branch
      conditions:
          - merged
          - base=master
          - label="request-backport-supported"
      actions:
          backport:
              branches:
                  - v1.6-branch
              labels:
                  - backport-v1.6-branch

    - name: Backport to v1.4.2-branch
      conditions:
          - merged
          - base=master
          - label="request-backport-supported"
      actions:
          backport:
              branches:
                  - v1.4.2-branch
              labels:
                  - backport-v1.4.2-branch

    # ===== Telink fork backport rules =====
    # One rule per target branch (Mergify has no templating). Trigger labels are
    # request-backport-<target>; the generated PR is labelled backport-<target>,
    # so a backport PR never re-triggers these rules (no ping-pong between the
    # dev branches). Every rule is label-gated: nothing is backported by default.
    #
    # Source bases by target family (verified against the real branch layout):
    #   * upstream mirror branches (v1.5/v1.6/v1.6.1/v1.7/v1.4.2) <- base=master
    #   * dev-tlk_v1.5 / dev-tlk_v1.6.1 <- master, v*-branch, or the other dev line
    #   * v1.5 family release/pre_release     <- base=dev-tlk_v1.5 (or master)
    #   * v1.6.1 family release/pre_release   <- base=dev-tlk_v1.6.1 (or master)

    # --- upstream (master / v*-branch) and cross-dev sync -> dev branches ---
    - name: Backport to dev-tlk_v1.5
      conditions:
          - merged
          - or:
                - base=master
                - base~=^v.+-branch$
                # down-port from the newer dev line
                - base=dev-tlk_v1.6.1
          - label="request-backport-dev-tlk_v1.5"
      actions:
          backport:
              branches:
                  - dev-tlk_v1.5
              labels:
                  - backport-dev-tlk_v1.5

    - name: Backport to dev-tlk_v1.6.1
      conditions:
          - merged
          - or:
                - base=master
                - base~=^v.+-branch$
                # forward-port from the previous dev line
                - base=dev-tlk_v1.5
          - label="request-backport-dev-tlk_v1.6.1"
      actions:
          backport:
              branches:
                  - dev-tlk_v1.6.1
              labels:
                  - backport-dev-tlk_v1.6.1

    # --- dev-tlk_v1.5 family -> v1.5 release / pre-release branches ---
    - name: Backport to release-v1.5-v1.5-branch
      conditions:
          - merged
          - or:
                - base=dev-tlk_v1.5
                - base=master
          - label="request-backport-release-v1.5-v1.5-branch"
      actions:
          backport:
              branches:
                  - release-v1.5-v1.5-branch
              labels:
                  - backport-release-v1.5-v1.5-branch

    - name: Backport to release-v1.4-v1.5-branch
      conditions:
          - merged
          - or:
                - base=dev-tlk_v1.5
                - base=master
          - label="request-backport-release-v1.4-v1.5-branch"
      actions:
          backport:
              branches:
                  - release-v1.4-v1.5-branch
              labels:
                  - backport-release-v1.4-v1.5-branch

    - name: Backport to release-v1.0-v1.5-branch
      conditions:
          - merged
          - or:
                - base=dev-tlk_v1.5
                - base=master
          - label="request-backport-release-v1.0-v1.5-branch"
      actions:
          backport:
              branches:
                  - release-v1.0-v1.5-branch
              labels:
                  - backport-release-v1.0-v1.5-branch

    - name: Backport to pre_release-v1.1-v1.5-branch
      conditions:
          - merged
          - or:
                - base=dev-tlk_v1.5
                - base=master
          - label="request-backport-pre_release-v1.1-v1.5-branch"
      actions:
          backport:
              branches:
                  - pre_release-v1.1-v1.5-branch
              labels:
                  - backport-pre_release-v1.1-v1.5-branch

    - name: Backport to pre_release-v1.2-v1.5-branch
      conditions:
          - merged
          - or:
                - base=dev-tlk_v1.5
                - base=master
          - label="request-backport-pre_release-v1.2-v1.5-branch"
      actions:
          backport:
              branches:
                  - pre_release-v1.2-v1.5-branch
              labels:
                  - backport-pre_release-v1.2-v1.5-branch

    # --- dev-tlk_v1.6.1 family -> v1.6.1 release / pre-release branches ---
    - name: Backport to release-v1.6-v1.6.1-branch
      conditions:
          - merged
          - or:
                - base=dev-tlk_v1.6.1
                - base=master
          - label="request-backport-release-v1.6-v1.6.1-branch"
      actions:
          backport:
              branches:
                  - release-v1.6-v1.6.1-branch
              labels:
                  - backport-release-v1.6-v1.6.1-branch

    - name: Backport to pre_release-v1.1-v1.6.1-branch
      conditions:
          - merged
          - or:
                - base=dev-tlk_v1.6.1
                - base=master
          - label="request-backport-pre_release-v1.1-v1.6.1-branch"
      actions:
          backport:
              branches:
                  - pre_release-v1.1-v1.6.1-branch
              labels:
                  - backport-pre_release-v1.1-v1.6.1-branch

    # --- Telink dev -> upstream mirror branch ---
    - name: Backport to v1.5-branch
      conditions:
          - merged
          - or:
                - base=dev-tlk_v1.5
                - base=master
          - label="request-backport-v1.5-branch"
      actions:
          backport:
              branches:
                  - v1.5-branch
              labels:
                  - backport-v1.5-branch

    - name: Request review for MVE/SVE backports
      conditions:
          - author=mergify[bot]
          - or:
                - label~=mve-branch
                - label~=sve-branch
      actions:
          request_reviews:
              users:
                  - cecille

    # Auto-merge backport PRs when CI is green and there are no conflicts.
    # If a cherry-pick has conflicts or CI fails, the PR is left open for manual resolution.
    # WARNING: If the rule name below is changed, you must also update the
    # condition `check-failure~=Auto-merge clean backport PRs` to match the new name.
    - name: Auto-merge clean backport PRs
      conditions:
          - or:
                - label="backport-v1.7-branch"
                - label="backport-v1.6.1-branch"
                - label="backport-v1.6-branch"
                - label="backport-v1.5-branch"
                - label="backport-v1.4.2-branch"
                - label="backport-release-v1.0-v1.5-branch"
                - label="backport-release-v1.4-v1.5-branch"
                - label="backport-pre_release-v1.1-v1.5-branch"
                - label="backport-pre_release-v1.2-v1.5-branch"
                - label="backport-pre_release-v1.1-v1.6.1-branch"
                - label="backport-dev-tlk_v1.5"
                - label="backport-dev-tlk_v1.6.1"
                - label="backport-release-v1.5-v1.5-branch"
                - label="backport-release-v1.6-v1.6.1-branch"
          - author=mergify[bot]
          - "-conflict"
          - "-draft"
          # Same deadlock workaround as above: allow exactly 1 failure if it is
          # this rule's own self-check (which Mergify marks failed when conditions
          # stop matching, and GitHub retains that historic failure forever).
          - or:
                - "#check-failure=0"
                - and:
                      - "#check-failure=1"
                      # WARNING: This must match the rule name defined above.
                      # If the rule name changes, update this condition accordingly.
                      - check-failure~=Auto-merge clean backport PRs
          - "#check-pending=0"
          - check-success~=Build
      actions:
          merge:
              method: squash

merge_protections_settings:
    reporting_method: check-runs
