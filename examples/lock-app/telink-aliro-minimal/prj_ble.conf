# Aliro BLE transport configuration for TL7218X.
CONFIG_ALIRO_TRANSPORT_NFC=n
CONFIG_ALIRO_TRANSPORT_BLE=y
CONFIG_ALIRO_BT_POLLER_THREAD_STACK_SIZE=4096
CONFIG_ALIRO_FAST_TRANSACTION=n

# Preload the public CSA Test Tool credentials used by this Stage 2 BLE release.
CONFIG_ALIRO_CSA_TEST_CREDENTIALS=y

# Matter and Aliro use separate Bluetooth identities.
CONFIG_BT_MAX_CONN=1
CONFIG_TL_BLE_CTRL_SLAVE_MAX_NUM=1
CONFIG_BT_ID_MAX=2
CONFIG_BT_BONDABLE=n
CONFIG_BT_EXT_ADV=n

# Aliro APDU transport uses a dynamically allocated LE L2CAP channel.
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
# The RX callback copies a complete Aliro frame into the reader's queue.
CONFIG_BT_RX_STACK_SIZE=3072

# Run BLE and Thread concurrently on the Telink controller.
CONFIG_IEEE802154_TLX_BLE_COEXIST=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_TL_BLE_CTRL_THREAD_STACK_SIZE=8192
