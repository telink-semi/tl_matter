# Aliro BLE-only RKE bring-up profile for TL7218X.
# Matter retains ownership of the Zephyr Bluetooth host and uses identity 0.
CONFIG_ALIRO_TRANSPORT_NFC=n
CONFIG_ALIRO_TRANSPORT_BLE=y
CONFIG_ALIRO_BT_POLLER_THREAD_STACK_SIZE=4096

# Keep room for a Matter commissioning connection and an Aliro connection.
CONFIG_BT_MAX_CONN=2
CONFIG_BT_ID_MAX=2

# Aliro uses identity 1 and a dedicated connectable advertising set.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_TL_BLE_CTRL_EXT_ADV_SETS_NUM=2

# Aliro APDU transport uses a dynamically allocated LE L2CAP channel.
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# Required by the Telink concurrent BLE/Thread platform branch.
CONFIG_IEEE802154_TLX_BLE_COEXIST=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_TL_BLE_CTRL_THREAD_STACK_SIZE=8192
