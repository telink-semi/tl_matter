# TL7218X Concurrent Mode (Matter over Thread + BLE coexistence, line-powered)
# This config enables BLE + 802.15.4 coexistence and keeps BLE advertising
# available after commissioning (line-powered, CONFIG_PM=n).
#
# Usage:
#   west build -p -b tl7218x -d build_tl7218x_concurrent -- \
#   -DCONF_FILE="prj.conf;boards/tl7218x_concurrent.conf" > build_tl7218x_concurrent.log

# Enable concurrent mode (Matter over Thread + BLE).
CONFIG_CHIP_ENABLE_CONCURRENT_CONNECTION=y

# Keep BLE advertising available after commissioning (line-powered device).
CONFIG_CHIP_ENABLE_POST_COMMISSIONING_BLE_ADVERTISING=y
